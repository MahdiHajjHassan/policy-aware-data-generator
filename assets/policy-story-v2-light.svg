<title id="policyTitle">Recipient and country rules change the shape of a fictional dataset</title>
<desc id="policyDesc">Static fictional reference, not a runnable generator. A recipient-by-category matrix allows work and identity fields while finance columns depend on recipient and country. Operations in Aster omit pay, Finance in Aster include it, and Finance in Boreal omit it. The output schemas contain only permitted columns.</desc>
