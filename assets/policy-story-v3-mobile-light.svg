<title id="policyTitle">Recipient and country rules shape the permitted dataset</title>
<desc id="policyDesc">Recipient and country permissions determine the output columns. Operations in Aster omit pay fields, Finance in Aster include them, and Finance in Boreal omit them.</desc>
