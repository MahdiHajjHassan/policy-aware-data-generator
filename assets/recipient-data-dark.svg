<svg xmlns="http://www.w3.org/2000/svg" id="recipient-data-dark-root" viewBox="0 0 400 744" width="400" height="744" role="img" aria-labelledby="recipient-data-dark-title recipient-data-dark-desc"><title id="recipient-data-dark-title">Shape synthetic data for its recipient</title><desc id="recipient-data-dark-desc">An approved schema and recipient rules determine permitted fields, while unauthorized scope or invalid output stops delivery of synthetic records.</desc><defs><marker id="recipient-data-dark-arrow" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#b1cec4"/></marker><marker id="recipient-data-dark-accent" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#83d0bd"/></marker></defs><rect width="400" height="744" fill="#132320"/><path d="M 296 112 L 296 132 Q 296 140 288 140 L 152 140 Q 144 140 144 148 L 144 164" fill="none" stroke="#b1cec4" stroke-width="1.5" marker-end="url(#recipient-data-dark-arrow)"/><path d="M 224 212 L 272 212" fill="none" stroke="#b1cec4" stroke-width="1.5" marker-end="url(#recipient-data-dark-arrow)"/><path d="M 124 112 L 124 120 Q 124 128 116 128 L 32 128 Q 24 128 24 136 L 24 316 Q 24 324 32 324 L 56 324" fill="none" stroke="#b1cec4" stroke-width="1.5" marker-end="url(#recipient-data-dark-arrow)"/><path d="M 144 260 L 144 296" fill="none" stroke="#b1cec4" stroke-width="1.5" marker-end="url(#recipient-data-dark-arrow)"/><path d="M 144 352 L 144 392" fill="none" stroke="#b1cec4" stroke-width="1.5" marker-end="url(#recipient-data-dark-arrow)"/><path d="M 144 448 L 144 484" fill="none" stroke="#b1cec4" stroke-width="1.5" marker-end="url(#recipient-data-dark-arrow)"/><path d="M 224 532 L 272 532" fill="none" stroke="#b1cec4" stroke-width="1.5" marker-end="url(#recipient-data-dark-arrow)"/><path d="M 144 580 L 144 628" fill="none" stroke="#b1cec4" stroke-width="1.5" marker-end="url(#recipient-data-dark-arrow)"/><rect x="234" y="184" width="28" height="20" rx="2" fill="#132320"/><text x="248" y="198" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" text-anchor="middle" fill="#b1cec4">NO</text><rect x="152" y="266" width="36" height="20" rx="2" fill="#132320"/><text x="170" y="280" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" text-anchor="middle" fill="#b1cec4">YES</text><rect x="234" y="504" width="28" height="20" rx="2" fill="#132320"/><text x="248" y="518" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" text-anchor="middle" fill="#b1cec4">NO</text><rect x="152" y="590" width="36" height="20" rx="2" fill="#132320"/><text x="170" y="604" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" text-anchor="middle" fill="#b1cec4">YES</text><g data-node="input"><rect x="40" y="40" width="168" height="72" rx="6" fill="#132320" stroke="#b1cec4" stroke-width="1.2"/><text x="124" y="70" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600" text-anchor="middle" fill="#e5f3ef">API or file</text><text x="124" y="100" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" text-anchor="middle" fill="#b1cec4">Approved schema</text></g><g data-node="policy"><rect x="232" y="40" width="128" height="72" rx="6" fill="#132320" stroke="#b1cec4" stroke-width="1.2"/><text x="296" y="70" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600" text-anchor="middle" fill="#e5f3ef">Rules</text><text x="296" y="100" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" text-anchor="middle" fill="#b1cec4">Team / role / country</text></g><g data-node="scope"><path d="M 144 164 L 224 212 L 144 260 L 64 212 Z" fill="#21473b" stroke="#83d0bd" stroke-width="1.5"/><text x="144" y="207" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600" text-anchor="middle" fill="#83d0bd">Scope</text><text x="144" y="227" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600" text-anchor="middle" fill="#83d0bd">allowed?</text></g><g data-node="deny"><rect x="272" y="188" width="88" height="48" rx="20" fill="#132320" stroke="#b1cec4" stroke-width="1.2"/><text x="316" y="217" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600" text-anchor="middle" fill="#e5f3ef">Deny</text></g><g data-node="fields"><rect x="56" y="296" width="176" height="56" rx="6" fill="#132320" stroke="#b1cec4" stroke-width="1.2"/><text x="144" y="329" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600" text-anchor="middle" fill="#e5f3ef">Permitted fields</text></g><g data-node="generate"><rect x="56" y="392" width="176" height="56" rx="6" fill="#1d322c" stroke="#b1cec4" stroke-width="1.2"/><text x="144" y="425" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600" text-anchor="middle" fill="#e5f3ef">Synthetic records</text></g><g data-node="check"><path d="M 144 484 L 224 532 L 144 580 L 64 532 Z" fill="#21473b" stroke="#83d0bd" stroke-width="1.5"/><text x="144" y="527" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600" text-anchor="middle" fill="#83d0bd">Output</text><text x="144" y="547" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600" text-anchor="middle" fill="#83d0bd">valid?</text></g><g data-node="reject"><rect x="272" y="508" width="88" height="48" rx="20" fill="#132320" stroke="#b1cec4" stroke-width="1.2"/><text x="316" y="537" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600" text-anchor="middle" fill="#e5f3ef">Reject</text></g><g data-node="export"><rect x="56" y="628" width="176" height="56" rx="20" fill="#132320" stroke="#b1cec4" stroke-width="1.2"/><text x="144" y="661" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600" text-anchor="middle" fill="#e5f3ef">Recipient dataset</text></g><line x1="40" y1="692" x2="360" y2="692" stroke="#4